<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let n = 153;
let temp = n;
let sum = 0;

while (temp > 0) {
    let digit = temp % 10;
    sum = sum + digit * digit * digit;
    temp = Math.floor(temp / 10);
}

if (sum == n) {
    document.write("Armstrong Number");
} else {
    document.write"Not Armstrong Number");
}
    </script>
</body>
</html>
