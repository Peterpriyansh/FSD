<!DOCTYPE html>
<html>
<head>
    <title>Online Shop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .shop {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ccc;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .product h3 {
            margin: 10px 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .plus, .minus {
            background: #222;
            color: white;
        }

        .buy {
            display: block;
            margin: 30px auto;
            background: green;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
        }

        #bill {
            display: none;
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #bbb;
        }

        #bill h2 {
            text-align: center;
        }

        .bill-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .print {
            background: #333;
            color: white;
            margin-top: 20px;
            width: 100%;
        }

        @media(max-width: 700px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 450px) {
            .products {
                grid-template-columns: 1fr;
            }
        }

        @media print {
            body * {
                visibility: hidden;
            }

            #bill, #bill * {
                visibility: visible;
            }

            #bill {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Online Shop</h1>
</header>

<div class="shop">

    <div class="products">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=500">
            <h3>Tea</h3>
            <p class="price">₹120 / kg</p>

            <div class="buttons">
                <button class="minus" onclick="changeQty('Tea', -1)">−</button>
                <span id="Tea">0</span>
                <button class="plus" onclick="changeQty('Tea', 1)">+</button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500">
            <h3>Coffee</h3>
            <p class="price">₹500 / kg</p>

            <div class="buttons">
                <button class="minus" onclick="changeQty('Coffee', -1)">−</button>
                <span id="Coffee">0</span>
                <button class="plus" onclick="changeQty('Coffee', 1)">+</button>
            </div>
        </div>

        <div class="product">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTY3aoHzKj4f1SCQOJJXb80WNVDDjMYfuK24cjjK2N1o0aofkXZkj2WwjFl&s=10">
            <h3>Rice</h3>
            <p class="price">₹600 / kg</p>

            <div class="buttons">
                <button class="minus" onclick="changeQty('Rice', -1)">−</button>
                <span id="Rice">0</span>
                <button class="plus" onclick="changeQty('Rice', 1)">+</button>
            </div>
        </div>

        <div class="product">
            <img src="https://t3.ftcdn.net/jpg/02/94/32/78/360_F_294327839_PNdQ5RNzSM1T0O0a1e7DBtRG8bEAe0tt.jpg">
            <h3>Sugar</h3>
            <p class="price">₹700 / kg</p>

            <div class="buttons">
                <button class="minus" onclick="changeQty('Sugar', -1)">−</button>
                <span id="Sugar">0</span>
                <button class="plus" onclick="changeQty('Sugar', 1)">+</button>
            </div>
        </div>

    </div>

    <button class="buy" onclick="buy()">🛍️ Buy Now</button>

    <div id="bill">
        <h2>🧾 Purchase Bill</h2>

        <p id="date"></p>
        <p id="time"></p>

        <div id="billItems"></div>

        <p class="total">
            Total Amount: ₹<span id="total">0</span>
        </p>

        <button class="print" onclick="window.print()">
            🖨️ Print Bill
        </button>
    </div>

</div>

<script>

let products = {
    Tea: {
        price: 120,
        qty: 0
    },

    Coffee: {
        price: 500,
        qty: 0
    },

    Rice: {
        price: 600,
        qty: 0
    },

    Sugar: {
        price: 700,
        qty: 0
    }
};

function changeQty(product, value) {

    products[product].qty += value;

    if (products[product].qty < 0) {
        products[product].qty = 0;
    }

    document.getElementById(product).innerText =
        products[product].qty;
}

function buy() {

    let total = 0;
    let bill = "";

    for (let product in products) {

        let item = products[product];

        if (item.qty > 0) {

            let amount = item.price * item.qty;

            total += amount;

            bill += `
                <div class="bill-item">
                    <span>${product} × ${item.qty} kg</span>
                    <span>₹${amount}</span>
                </div>
            `;
        }
    }

    if (total == 0) {
        alert("Please select a product!");
        return;
    }

    let now = new Date();

    document.getElementById("date").innerText =
        "Date: " + now.toLocaleDateString();

    document.getElementById("time").innerText =
        "Purchase Time: " + now.toLocaleTimeString();

    document.getElementById("billItems").innerHTML = bill;

    document.getElementById("total").innerText = total;

    document.getElementById("bill").style.display = "block";
}

</script>

</body>
</html>
